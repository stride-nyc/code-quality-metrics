# This workflow collects code metrics for the repository and stores them in a JSON file.
# It also creates an issue with the metrics summary.
# The workflow is scheduled to run weekly on Sunday.
# The workflow can also be triggered manually.
# This workflow requires merge/squash commits do not delete the head branches (project properties -> general -> merge strategy).
name: Collect Code Metrics
on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Collect Commit Metrics
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            // lib/ modules are available after checkout — require() resolves from $GITHUB_WORKSPACE
            const { CONFIG } = require('./lib/config');
            const { computeStatistics, computeVelocity } = require('./lib/statistics');
            const { scoreMessageQuality, classifyDoraArchetype, isTestFile, isExcludedPath } = require('./lib/metrics');

            // ---------------------------------------------------------------
            // Main collection
            // ---------------------------------------------------------------

            async function collectMetrics() {
              const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
              const since = new Date(Date.now() - CONFIG.ANALYSIS_DAYS * 24 * 60 * 60 * 1000).toISOString();

              console.log(`Repository: ${owner}/${repo}`);
              console.log(`Looking for commits since: ${since}`);

              try {
                const repoInfo = await github.rest.repos.get({ owner, repo });
                console.log(`Repository access confirmed: ${repoInfo.data.full_name}`);

                const branches = await github.paginate(github.rest.repos.listBranches, {
                  owner,
                  repo,
                  per_page: 100
                });

                const featureBranches = branches.filter(branch =>
                  !['main', 'master'].includes(branch.name.toLowerCase())
                );

                console.log(`Found ${branches.length} total branches`);
                console.log(`Analyzing ${featureBranches.length} feature branches: ${featureBranches.map(b => b.name).join(', ')}`);

                // github.rest.repos.getCommit (below) diffs a merge commit against its first
                // parent only, so for a conflict-free two-parent merge -- e.g. GitHub's "Merge
                // pull request" button on a single-commit PR, or a feature branch that merged
                // another branch into itself -- that reproduces one of the merged children's
                // diff exactly, and the same real change would be counted twice: once under the
                // merge sha, once under the child's own sha. Excluding any commit with more
                // than one parent here matches the rule chosen for the local pipeline in
                // lib/git.js's analyzeCommit (cd8e52f): skip the merge entirely rather than diff
                // it against every parent. Cost, same as there: a genuine merge that carries its
                // own conflict-resolution edits goes uncounted rather than double-counted. The
                // REST commit objects returned by listCommits already carry a `parents` array,
                // so no extra API call is needed. See code-quality-metrics-9vg.
                function dedupeAndFilterMerges(commits) {
                  const deduped = commits.filter((commit, index, self) =>
                    index === self.findIndex(c => c.sha === commit.sha)
                  );
                  return deduped.filter(commit => (commit.parents?.length ?? 1) <= 1);
                }

                let allCommits = [];
                let branchCommitCounts = {};

                for (const branch of featureBranches) {
                  try {
                    console.log(`Fetching commits from branch: ${branch.name}`);
                    const branchCommits = await github.paginate(github.rest.repos.listCommits, {
                      owner,
                      repo,
                      sha: branch.name,
                      since,
                      per_page: 100
                    });

                    branchCommitCounts[branch.name] = branchCommits.length;
                    allCommits = allCommits.concat(branchCommits.map(commit => ({
                      ...commit,
                      source_branch: branch.name
                    })));

                    await new Promise(resolve => setTimeout(resolve, 200));
                  } catch (error) {
                    console.log(`Error fetching commits from branch ${branch.name}: ${error.message}`);
                    branchCommitCounts[branch.name] = 0;
                  }
                }

                let uniqueCommits = dedupeAndFilterMerges(allCommits);

                console.log(`Found ${allCommits.length} total commits, ${uniqueCommits.length} after deduping and excluding merge commits`);
                console.log('Commits per branch:', branchCommitCounts);

                // A repository with bursty feature-branch activity (sprints separated by gaps
                // longer than CONFIG.ANALYSIS_DAYS) would otherwise produce a recurring
                // "no activity" issue every time the schedule fires between bursts, defeating
                // the workflow's purpose (code-quality-metrics-3s0). The since-filtered fetch
                // above stays the primary path -- it is cheap (bounded by `since`) and honest
                // about recency -- and only on a zero result do we pay for a second, still
                // bounded fetch of the newest commits regardless of date.
                let windowWidened = false;
                if (uniqueCommits.length === 0 && featureBranches.length > 0) {
                  console.log(`No commits found since ${since} across any feature branch. Widening to the newest commits on each branch, ignoring the requested date boundary.`);
                  windowWidened = true;
                  allCommits = [];
                  branchCommitCounts = {};

                  for (const branch of featureBranches) {
                    try {
                      console.log(`Fetching newest commits from branch (widened): ${branch.name}`);
                      // A single capped page, not github.paginate: `since` no longer bounds
                      // this query, so paginating here would walk a branch's entire history
                      // one page at a time on every zero-commit week. listCommits without
                      // `since` already returns newest-first, so one page of
                      // CONFIG.MAX_COMMITS is exactly the newest commits available on this
                      // branch, at a cost independent of how long its history is.
                      const { data: branchCommits } = await github.rest.repos.listCommits({
                        owner,
                        repo,
                        sha: branch.name,
                        per_page: CONFIG.MAX_COMMITS
                      });

                      branchCommitCounts[branch.name] = branchCommits.length;
                      allCommits = allCommits.concat(branchCommits.map(commit => ({
                        ...commit,
                        source_branch: branch.name
                      })));

                      await new Promise(resolve => setTimeout(resolve, 200));
                    } catch (error) {
                      console.log(`Error fetching commits from branch ${branch.name}: ${error.message}`);
                      branchCommitCounts[branch.name] = 0;
                    }
                  }

                  uniqueCommits = dedupeAndFilterMerges(allCommits);
                  // Each branch's page is independently newest-first, but interleaving
                  // branches in fetch order is not; sort globally before the MAX_COMMITS
                  // slice below so that slice keeps the actual newest commits.
                  uniqueCommits.sort((a, b) => new Date(b.commit.committer.date) - new Date(a.commit.committer.date));
                  console.log(`Widened fetch found ${uniqueCommits.length} commits across ${featureBranches.length} feature branches.`);
                }

                if (uniqueCommits.length === 0) {
                  console.log('No commits found in feature branches, even after widening past the requested window.');
                  const emptyMetrics = [];
                  const summary = {
                    total_commits: 0,
                    branches_analyzed: featureBranches.map(b => b.name),
                    branch_commit_counts: branchCommitCounts,
                    // The actual span covered is never reported here because there is none --
                    // no commits were found even after widening. window_requested_since and
                    // window_widened are still reported so the issue body can say honestly
                    // what was tried (code-quality-metrics-3s0).
                    analyzed_span_start: null,
                    analyzed_span_end: null,
                    window_requested_since: since,
                    window_widened: windowWidened,
                    large_commits_pct: "0.00",
                    sprawling_commits_pct: "0.00",
                    test_coverage_rate: "0.00",
                    test_isolation_rate: "0.00",
                    uncovered_prod_rate: "0.00",
                    avg_files_changed: "0.00",
                    avg_lines_changed: "0.00",
                    avg_prod_lines_changed: "0.00",
                    message_quality_pct: "0.00",
                    p50_lines_changed: 0,
                    p90_lines_changed: 0,
                    p95_lines_changed: 0,
                    stddev_lines_changed: 0,
                    velocity_commits_per_day: 0,
                    velocity_trend: "stable",
                    net_additions_ratio_median: 0,
                    net_additions_ratio_p90: 0,
                    dora_archetype: "mixed-signals",
                    note: "Feature branches only - main/master excluded. Large commit threshold applied to production code only."
                  };

                  fs.writeFileSync('commit_metrics.json', JSON.stringify(emptyMetrics, null, 2));
                  fs.writeFileSync('metrics_summary.json', JSON.stringify(summary, null, 2));
                  return;
                }

                const metrics = [];
                console.log(`Processing ${Math.min(uniqueCommits.length, CONFIG.MAX_COMMITS)} commits...`);

                for (const commit of uniqueCommits.slice(0, CONFIG.MAX_COMMITS)) {
                  try {
                    const detail = await github.rest.repos.getCommit({
                      owner,
                      repo,
                      ref: commit.sha
                    });

                    // A path matching ANALYSIS_IGNORE_PATTERNS counts as neither test nor
                    // production (code-quality-metrics-4fc, mirroring lib/git.js's
                    // analyzeCommit under code-quality-metrics-1tp): excluded from
                    // classification and from the file count sprawling_commit is judged
                    // against, but files_changed below stays the raw, honest count.
                    const allFiles = detail.data.files || [];
                    const countableFiles = allFiles.filter(f => !isExcludedPath(f.filename));
                    const testFiles = countableFiles.filter(f => isTestFile(f.filename));
                    const prodFiles = countableFiles.filter(f => !isTestFile(f.filename));

                    const message = commit.commit.message.split('\n')[0];

                    metrics.push({
                      sha: commit.sha,
                      date: commit.commit.committer.date,
                      message,
                      author: commit.commit.author.name,
                      source_branch: commit.source_branch,
                      total_additions: detail.data.stats.additions,
                      total_deletions: detail.data.stats.deletions,
                      files_changed: allFiles.length,
                      test_files_count: testFiles.length,
                      prod_files_count: prodFiles.length,
                      // Same-commit co-occurrence, not an ordering claim -- see
                      // code-quality-metrics-36d and lib/git.js's analyzeCommit for the
                      // citations (Sun et al. TOSEM 2023, Borle et al. EMSE 2018,
                      // Marsavina et al. SCAM 2014) behind renaming this away from
                      // test_first_indicator.
                      test_prod_cochange_commit: testFiles.length > 0 && prodFiles.length > 0,
                      test_only_commit: testFiles.length > 0 && prodFiles.length === 0,
                      uncovered_prod_commit: testFiles.length === 0 && prodFiles.length > 0 && (prodFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0)) > CONFIG.LARGE_COMMIT_THRESHOLD,
                      prod_additions: prodFiles.reduce((sum, f) => sum + f.additions, 0),
                      prod_deletions: prodFiles.reduce((sum, f) => sum + f.deletions, 0),
                      large_commit: (prodFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0)) > CONFIG.LARGE_COMMIT_THRESHOLD,
                      sprawling_commit: countableFiles.length > CONFIG.SPRAWLING_COMMIT_THRESHOLD,
                      message_quality: scoreMessageQuality(message),
                      commit_type: "feature_branch"
                    });

                    await new Promise(resolve => setTimeout(resolve, 100));
                  } catch (error) {
                    console.log(`Error processing commit ${commit.sha}: ${error.message}`);
                  }
                }

                console.log(`Saving metrics for ${metrics.length} commits`);
                fs.writeFileSync('commit_metrics.json', JSON.stringify(metrics, null, 2));

                // Statistical distributions
                const timestamps = metrics.map(m => new Date(m.date).getTime());
                const lineSizes = metrics.map(m => m.total_additions + m.total_deletions);
                const lineStats = computeStatistics(lineSizes, timestamps);
                const fileStats = computeStatistics(metrics.map(m => m.files_changed), timestamps);
                const ratios = metrics.map(m => {
                  const t = m.total_additions + m.total_deletions;
                  return t === 0 ? 0 : (m.total_additions - m.total_deletions) / t;
                });
                const ratioStats = computeStatistics(ratios, timestamps);
                const velocity = computeVelocity(metrics.map(m => m.date));

                // The actual span the analyzed commits cover, never the requested window or
                // "today" -- mirrors local-code-metrics.js's analyzed_span_start/end
                // (code-quality-metrics-g10) so a widened run states honestly what it found
                // rather than repeating the requested boundary (code-quality-metrics-3s0).
                const sortedDates = metrics.map(m => m.date).slice().sort();
                const analyzedSpanStart = sortedDates[0];
                const analyzedSpanEnd = sortedDates[sortedDates.length - 1];

                const qualityCount = metrics.filter(m => m.message_quality).length;
                const msgQualityPct = metrics.length > 0
                  ? ((qualityCount / metrics.length) * 100).toFixed(2)
                  : "0.00";

                const largePct = parseFloat((metrics.filter(m => m.large_commit).length / metrics.length * 100).toFixed(2));
                const sprawlingPct = parseFloat((metrics.filter(m => m.sprawling_commit).length / metrics.length * 100).toFixed(2));
                const testCoveragePct = parseFloat((metrics.filter(m => m.test_prod_cochange_commit).length / metrics.length * 100).toFixed(2));
                const testIsolationPct = parseFloat((metrics.filter(m => m.test_only_commit).length / metrics.length * 100).toFixed(2));
                const uncoveredProdPct = parseFloat((metrics.filter(m => m.uncovered_prod_commit).length / metrics.length * 100).toFixed(2));

                const summary = {
                  total_commits: metrics.length,
                  filtered_from: uniqueCommits.length,
                  analyzed_span_start: analyzedSpanStart,
                  analyzed_span_end: analyzedSpanEnd,
                  window_requested_since: since,
                  window_widened: windowWidened,
                  branches_analyzed: featureBranches.map(b => b.name),
                  branch_commit_counts: branchCommitCounts,
                  large_commits_pct: largePct.toFixed(2),
                  sprawling_commits_pct: sprawlingPct.toFixed(2),
                  test_coverage_rate: testCoveragePct.toFixed(2),
                  test_isolation_rate: testIsolationPct.toFixed(2),
                  uncovered_prod_rate: uncoveredProdPct.toFixed(2),
                  avg_files_changed: (metrics.reduce((sum, m) => sum + m.files_changed, 0) / metrics.length).toFixed(2),
                  avg_lines_changed: (metrics.reduce((sum, m) => sum + (m.prod_additions || 0) + (m.prod_deletions || 0), 0) / metrics.length).toFixed(2),
                  avg_prod_lines_changed: (metrics.reduce((sum, m) => sum + (m.prod_additions || 0) + (m.prod_deletions || 0), 0) / metrics.length).toFixed(2),
                  p50_lines_changed: Math.round(lineStats.p50),
                  p90_lines_changed: Math.round(lineStats.p90),
                  p95_lines_changed: Math.round(lineStats.p95),
                  stddev_lines_changed: Math.round(lineStats.stddev),
                  p50_files_changed: Math.round(fileStats.p50),
                  p90_files_changed: Math.round(fileStats.p90),
                  velocity_commits_per_day: velocity.commits_per_day,
                  velocity_trend: velocity.trend,
                  net_additions_ratio_median: parseFloat(ratioStats.p50.toFixed(2)),
                  net_additions_ratio_p90: parseFloat(ratioStats.p90.toFixed(2)),
                  message_quality_pct: msgQualityPct,
                  // message_quality_pct is not passed here: classifyDoraArchetype (lib/metrics.js)
                  // reads only large-commit, sprawling, test-coverage and uncovered-prod from
                  // THRESHOLDS, so message quality has no part in the archetype (code-quality-metrics-4hu).
                  dora_archetype: classifyDoraArchetype({ large_commits_pct: largePct.toFixed(2), sprawling_commits_pct: sprawlingPct.toFixed(2), test_coverage_rate: testCoveragePct.toFixed(2), uncovered_prod_rate: uncoveredProdPct.toFixed(2) }),
                  note: "Feature branches only - main/master excluded. Large commit threshold applied to production code only."
                };

                fs.writeFileSync('metrics_summary.json', JSON.stringify(summary, null, 2));
                console.log('Summary:', summary);

              } catch (error) {
                console.error('Error in collectMetrics:', error);
                throw error;
              }
            }

            collectMetrics();

      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-metrics-${{ github.run_number }}
          path: |
            commit_metrics.json
            metrics_summary.json
          if-no-files-found: warn

      - name: Create Issue with Results
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // lib/ modules are available after checkout — require() resolves from $GITHUB_WORKSPACE
            const { THRESHOLDS } = require('./lib/thresholds');
            const { CONFIG } = require('./lib/config');
            const summary = JSON.parse(fs.readFileSync('metrics_summary.json', 'utf8'));

            const branchActivity = Object.entries(summary.branch_commit_counts || {})
              .map(([branch, count]) => `- ${branch}: ${count} commits`)
              .join('\n');

            function statusMark(value, threshold, direction = 'below') {
              const ok = direction === 'below' ? parseFloat(value) < threshold : parseFloat(value) > threshold;
              return ok ? 'OK' : 'Warning';
            }

            // Renders a metric's calibrated band as "<healthy%, critical >critical%".
            // Some bands are two-band (critical: null in lib/thresholds.js -- the
            // extreme rests on a single reference repo, not two corroborating
            // repos; see lib/thresholds.js's header comment). Formatting `critical`
            // without this check would print "critical > null%" for those metrics.
            function formatBand(direction, healthy, critical, unit = '%') {
              const healthyCmp = direction === 'above' ? '>' : '<';
              const target = `${healthyCmp}${healthy}${unit}`;
              if (critical === null || critical === undefined) {
                return `${target} (no critical band established)`;
              }
              const criticalCmp = direction === 'above' ? '<' : '>';
              return `${target}, critical ${criticalCmp}${critical}${unit}`;
            }

            const archetypeDescriptions = {
              'harmonious-high-achiever': 'Strong foundational practices; AI tools likely amplifying positive outcomes.',
              'foundational-challenges': 'Weak testing or batch discipline; AI tools may be accelerating debt accumulation.',
              'legacy-bottleneck': 'Architectural scatter combined with large commits; AI making cross-cutting changes worse.',
              'mixed-signals': 'Inconsistent patterns across metrics; investigate specific outlier commits.'
            };

            const archetype = summary.dora_archetype || 'mixed-signals';
            const archetypeDesc = archetypeDescriptions[archetype] || '';

            const bodyLines = [
              '## Weekly Code Metrics Report',
              '',
              `**Period:** Last 30 days`,
              `**Commits Analyzed:** ${summary.total_commits}`,
              `**Branches Analyzed:** ${summary.branches_analyzed?.join(', ') || 'N/A'}`,
              '',
              '### Key Metrics',
              '',
              '| Metric | Value | Target | Status |',
              '|--------|-------|--------|--------|',
              `| Large Commits (>${CONFIG.LARGE_COMMIT_THRESHOLD} prod lines) | ${summary.large_commits_pct}% | ${formatBand('below', THRESHOLDS.LARGE_COMMITS_PCT.healthy, THRESHOLDS.LARGE_COMMITS_PCT.critical)} | ${statusMark(summary.large_commits_pct, THRESHOLDS.LARGE_COMMITS_PCT.healthy)} |`,
              `| Sprawling Commits (>${CONFIG.SPRAWLING_COMMIT_THRESHOLD} files) | ${summary.sprawling_commits_pct}% | ${formatBand('below', THRESHOLDS.SPRAWLING_COMMITS_PCT.healthy, THRESHOLDS.SPRAWLING_COMMITS_PCT.critical)} | ${statusMark(summary.sprawling_commits_pct, THRESHOLDS.SPRAWLING_COMMITS_PCT.healthy)} |`,
              `| Test Coverage (test+prod commits) | ${summary.test_coverage_rate}% | ${formatBand('above', THRESHOLDS.TEST_COVERAGE_RATE.healthy, null)} | ${statusMark(summary.test_coverage_rate, THRESHOLDS.TEST_COVERAGE_RATE.healthy, 'above')} |`,
              `| Test Isolation (test-only commits) | ${summary.test_isolation_rate}% | ${formatBand('above', THRESHOLDS.TEST_ISOLATION_RATE.positive, null)} | ${statusMark(summary.test_isolation_rate, THRESHOLDS.TEST_ISOLATION_RATE.positive, 'above')} |`,
              `| Uncovered Prod (large, no tests) | ${summary.uncovered_prod_rate}% | ${formatBand('below', THRESHOLDS.UNCOVERED_PROD_RATE.healthy, THRESHOLDS.UNCOVERED_PROD_RATE.critical)} | ${statusMark(summary.uncovered_prod_rate, THRESHOLDS.UNCOVERED_PROD_RATE.healthy)} |`,
              `| Message Quality | ${summary.message_quality_pct}% | no band, see spec |`,
              `| Net Additions Ratio (median) | ${summary.net_additions_ratio_median} | no band, see spec |`,
              '',
              '### Commit Size Distribution',
              '',
              '| Percentile | Lines Changed |',
              '|------------|---------------|',
              `| p50 (median) | ${summary.p50_lines_changed} |`,
              `| p90 | ${summary.p90_lines_changed} |`,
              `| p95 | ${summary.p95_lines_changed} |`,
              `| Std Dev | ${summary.stddev_lines_changed} |`,
              '',
              `**Commit size trend:** ${summary.velocity_trend === 'accelerating' ? 'Accelerating (monitor closely)' : summary.velocity_trend === 'decelerating' ? 'Decelerating' : 'Stable'}`,
              '',
              '### DORA Team Archetype',
              '',
              `**${archetype}**`,
              '',
              archetypeDesc,
              '',
              '### Branch Activity',
              '',
              branchActivity,
              '',
              '### Interpretation',
              '',
              `- Target: <${THRESHOLDS.LARGE_COMMITS_PCT.healthy}% large commits, <${THRESHOLDS.SPRAWLING_COMMITS_PCT.healthy}% sprawling commits`,
              `- Test/prod co-change rate (same-commit only, not test-first ordering) should remain above ${THRESHOLDS.TEST_COVERAGE_RATE.healthy}%`,
              '- Large commits measured by production code only (excludes test files)',
              `- p90 lines changed: ${summary.p90_lines_changed} vs. healthy target ${formatBand('below', THRESHOLDS.P90_LINES_CHANGED.healthy, THRESHOLDS.P90_LINES_CHANGED.critical, ' lines')}`,
              '',
              '_Generated by Code Metrics Workflow_'
            ];

            const body = bodyLines.join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Code Metrics Report - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['metrics', 'automated']
            });

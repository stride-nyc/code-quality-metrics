name: Enhanced PR Analysis with Commit Metrics
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Enhanced PR Analysis
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // lib/ modules are available after checkout — require() resolves from $GITHUB_WORKSPACE
            const { CONFIG } = require('./lib/config');
            const { THRESHOLDS } = require('./lib/thresholds');
            const { scoreMessageQuality, classifyDoraArchetype, isTestFile, isExcludedPath, isBotCommit } = require('./lib/metrics');
            const { runDuplicateCheck, resolveModuleNeighbors } = require('./lib/duplicate');
            const { getAnthropicClient, analyzeDuplicatesWithClaude } = require('./lib/claude');

            // Renders a metric's calibrated band as "<healthy%, critical >critical%".
            // Some bands are two-band (critical: null in lib/thresholds.js -- the
            // extreme rests on a single reference repo, not two corroborating
            // repos; see lib/thresholds.js's header comment). Formatting `critical`
            // without this check would print "critical > null%" for those metrics.
            function formatBand(direction, healthy, critical, unit = '%') {
              const healthyCmp = direction === 'above' ? '>' : '<';
              const target = `${healthyCmp}${healthy}${unit}`;
              if (critical === null || critical === undefined) {
                return `${target} (no critical band established)`;
              }
              const criticalCmp = direction === 'above' ? '<' : '>';
              return `${target}, critical ${criticalCmp}${critical}${unit}`;
            }

            // ---------------------------------------------------------------
            // Fetch PR data
            // ---------------------------------------------------------------

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            // Verified NOT affected by the merge double-count fixed in code-metrics.yml under
            // code-quality-metrics-9vg (which lists commits per branch via listCommits/getCommit
            // and can retain a two-parent merge alongside the child it duplicates). Two reasons,
            // both structural rather than incidental:
            //   1. pulls.listCommits lists only commits reachable from the PR head that are not
            //      already reachable from the PR base -- the same shape as `git log base..head`.
            //      The merge commit GitHub's "Merge pull request" button creates lands on the
            //      base branch, and only exists once the PR merges. This workflow runs on
            //      `opened`/`synchronize`, strictly before that merge commit exists, so it can
            //      never appear in this PR's own commit list.
            //   2. A merge commit can still appear here if a contributor merges another branch
            //      (e.g. the base) into their PR branch mid-review. But getCommit diffs it
            //      against its first parent, which is the PR's own preceding commit -- not a
            //      sibling already present in this same commits array -- so that diff does not
            //      reproduce any other entry already being counted. The exact-duplicate shape
            //      the fix addresses (merge and child both present, both showing identical
            //      stats) requires the merge's *child* to independently appear in the same
            //      listing, which a PR's own commit history does not produce.
            // No filtering added here as a result. If PR history ever includes a merge commit
            // whose second parent is itself later force-included (e.g. two open PRs sharing
            // a merge sha), re-open code-quality-metrics-9vg rather than re-deriving this.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            // Dependency/CI bot exclusion (issue #62): a bot commit (dependabot, renovate,
            // github-actions, release/version-bump bots, other [bot] accounts) mixed into an
            // otherwise human PR is excluded from the per-commit analysis below, mirroring
            // code-metrics.yml's identical filter. isBotCommit checks the AI-agent exemption
            // first and unconditionally (lib/metrics.js), so a commit attributable to an AI
            // coding agent (Claude Code, Copilot, Cursor, Devin, Aider, ...) by author,
            // committer, or Co-Authored-By trailer is never excluded here, however
            // bot-flavored its account name looks. Bot commits are counted and reported below
            // ("Bot commits excluded"), never silently dropped. The job-level
            // `if: github.actor != 'dependabot[bot]'` guard above only skips a PR whose
            // *actor* is dependabot; this covers the narrower case of a bot commit riding
            // along inside a human-opened PR.
            function commitClassificationInput(commit) {
              return {
                author: commit.commit.author.name,
                committer: commit.commit.committer && commit.commit.committer.name,
                full_message: commit.commit.message
              };
            }
            const botCommitCount = commits.filter(commit => isBotCommit(commitClassificationInput(commit))).length;
            const humanCommitsOnly = commits.filter(commit => !isBotCommit(commitClassificationInput(commit)));

            console.log(`Analyzing ${humanCommitsOnly.length} commits and ${files.length} files in PR`);

            // A path matching ANALYSIS_IGNORE_PATTERNS counts as neither test nor production
            // (code-quality-metrics-4fc, mirroring lib/git.js's analyzeCommit under
            // code-quality-metrics-1tp): excluded from classification and from the file
            // count sprawling_commit is judged against below.
            const countableFiles = files.filter(f => !isExcludedPath(f.filename));
            const testFiles = countableFiles.filter(f => isTestFile(f.filename));
            const prodFiles = countableFiles.filter(f => !isTestFile(f.filename));

            // ---------------------------------------------------------------
            // Per-commit analysis
            // ---------------------------------------------------------------

            const commitMetrics = [];
            for (const commit of humanCommitsOnly) {
              try {
                const detail = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: commit.sha
                });

                // Same exclusion as the PR-level countableFiles above (code-quality-metrics-4fc):
                // files_changed below stays the raw, honest count.
                const commitAllFiles = detail.data.files || [];
                const commitCountableFiles = commitAllFiles.filter(f => !isExcludedPath(f.filename));
                const commitTestFiles = commitCountableFiles.filter(f => isTestFile(f.filename));
                const commitProdFiles = commitCountableFiles.filter(f => !isTestFile(f.filename));

                const prodChanges = commitProdFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
                const testChanges = commitTestFiles.reduce((sum, f) => sum + f.additions + f.deletions, 0);
                const additions = detail.data.stats?.additions || 0;
                const deletions = detail.data.stats?.deletions || 0;
                const totalChurn = additions + deletions;
                const message = commit.commit.message.split('\n')[0];

                commitMetrics.push({
                  sha: commit.sha.substring(0, 7),
                  message,
                  author: commit.commit.author.name,
                  date: new Date(commit.commit.author.date).toLocaleDateString(),
                  files_changed: commitAllFiles.length,
                  prod_files: commitProdFiles.length,
                  test_files: commitTestFiles.length,
                  prod_changes: prodChanges,
                  test_changes: testChanges,
                  total_changes: detail.data.stats.additions + detail.data.stats.deletions,
                  large_commit: prodChanges > CONFIG.LARGE_COMMIT_THRESHOLD,
                  sprawling_commit: commitCountableFiles.length > CONFIG.SPRAWLING_COMMIT_THRESHOLD,
                  // Same-commit co-occurrence, not an ordering claim -- see
                  // code-quality-metrics-36d and lib/git.js's analyzeCommit for the
                  // citations (Sun et al. TOSEM 2023, Borle et al. EMSE 2018,
                  // Marsavina et al. SCAM 2014) behind renaming this away from
                  // test_first_indicator.
                  test_prod_cochange_commit: commitTestFiles.length > 0 && commitProdFiles.length > 0,
                  test_only_commit: commitTestFiles.length > 0 && commitProdFiles.length === 0,
                  uncovered_prod_commit: commitTestFiles.length === 0 && commitProdFiles.length > 0 && prodChanges > CONFIG.LARGE_COMMIT_THRESHOLD,
                  test_only: commitTestFiles.length > 0 && commitProdFiles.length === 0,
                  prod_only: commitProdFiles.length > 0 && commitTestFiles.length === 0,
                  test_ratio: prodChanges > 0 ? (testChanges / prodChanges) : 0,
                  net_additions_ratio: (totalChurn === 0 ? 0 : (additions - deletions) / totalChurn).toFixed(2),
                  message_quality: scoreMessageQuality(message)
                });

                await new Promise(resolve => setTimeout(resolve, 100));
              } catch (error) {
                console.log(`Error analyzing commit ${commit.sha}: ${error.message}`);
              }
            }

            // ---------------------------------------------------------------
            // PR-level aggregates
            // ---------------------------------------------------------------

            const totalAdditions = pr.additions;
            const totalDeletions = pr.deletions;
            const totalChangedFiles = pr.changed_files;
            const totalChanges = totalAdditions + totalDeletions;

            const prodAdditions = prodFiles.reduce((sum, f) => sum + f.additions, 0);
            const prodDeletions = prodFiles.reduce((sum, f) => sum + f.deletions, 0);
            const prodChanges = prodAdditions + prodDeletions;
            const prodFilesCount = prodFiles.length;

            const staticDuplicates = runDuplicateCheck(prodFiles.map(f => f.filename));
            const anthropicClient = await getAnthropicClient();
            const semanticFindings = anthropicClient
              ? await analyzeDuplicatesWithClaude(
                  anthropicClient,
                  resolveModuleNeighbors(prodFiles.map(f => f.filename)),
                  staticDuplicates
                )
              : [];

            const testAdditions = testFiles.reduce((sum, f) => sum + f.additions, 0);
            const testDeletions = testFiles.reduce((sum, f) => sum + f.deletions, 0);
            const testChanges = testAdditions + testDeletions;
            const testFilesCount = testFiles.length;

            const largeCommits = commitMetrics.filter(c => c.large_commit).length;
            const sprawlingCommits = commitMetrics.filter(c => c.sprawling_commit).length;
            const cochangeCommits = commitMetrics.filter(c => c.test_prod_cochange_commit).length;
            const testOnlyCommits = commitMetrics.filter(c => c.test_only).length;
            const prodOnlyCommits = commitMetrics.filter(c => c.prod_only).length;
            const qualityCommits = commitMetrics.filter(c => c.message_quality).length;

            const avgCommitSize = commitMetrics.length > 0
              ? (commitMetrics.reduce((sum, c) => sum + c.prod_changes, 0) / commitMetrics.length)
              : 0;

            const avgFilesPerCommit = commitMetrics.length > 0
              ? (commitMetrics.reduce((sum, c) => sum + c.files_changed, 0) / commitMetrics.length)
              : 0;

            const largePct = commitMetrics.length > 0 ? (largeCommits / commitMetrics.length * 100) : 0;
            const sprawlingPct = commitMetrics.length > 0 ? (sprawlingCommits / commitMetrics.length * 100) : 0;
            const cochangePct = commitMetrics.length > 0 ? (cochangeCommits / commitMetrics.length * 100) : 0;
            const testCoveragePct = cochangePct;
            const uncoveredProdPct = commitMetrics.length > 0 ? (commitMetrics.filter(c => c.uncovered_prod_commit).length / commitMetrics.length * 100) : 0;
            const msgQualityPct = commitMetrics.length > 0 ? (qualityCommits / commitMetrics.length * 100) : 0;

            const medianAdditionsRatio = (() => {
              const ratios = commitMetrics.map(c => parseFloat(c.net_additions_ratio)).sort((a, b) => a - b);
              if (ratios.length === 0) return 0;
              const mid = Math.floor(ratios.length / 2);
              return ratios.length % 2 !== 0 ? ratios[mid] : (ratios[mid - 1] + ratios[mid]) / 2;
            })();

            // ---------------------------------------------------------------
            // Minimum-sample guard for rate verdicts (code-quality-metrics-w9f)
            // ---------------------------------------------------------------

            // THRESHOLDS.LARGE_COMMITS_PCT, .SPRAWLING_COMMITS_PCT and .TEST_COVERAGE_RATE are
            // calibrated from 50-commit repo-window samples (see lib/thresholds.js). A rate over
            // this PR's own n=1..~10 commits can only take a handful of discrete values (0%,
            // 1/n%, ..., 100%), so at n=1 the rate is either 0% or 100% and comparing it to a
            // p75-of-window band is not a meaningful comparison -- the same reasoning that
            // already kept P90_FILES_CHANGED off prodFilesCount above (a p90 across many commits
            // in a time window is not the same measurement as one PR's raw count). Below this
            // guard, the rate is still reported (DORA table, Commit Analysis table) but no
            // pass/fail verdict is drawn from it.
            //
            // MIN_COMMITS_FOR_RATE_VERDICT is a convention chosen for this guard, not a value
            // derived from calibration/observations.json or any cited source -- unlike the
            // bands it gates comparisons against. Nothing in the calibration data speaks to how
            // small a sample can get before a rate stops being informative; 5 is picked only as
            // a round number clearly smaller than the 50-commit windows the bands were derived
            // from, and clearly large enough that a single commit cannot swing the rate between
            // 0% and 100%.
            const MIN_COMMITS_FOR_RATE_VERDICT = 5;
            const hasEnoughCommitsForRateVerdict = commitMetrics.length >= MIN_COMMITS_FOR_RATE_VERDICT;
            const smallSampleNote = (commitMetrics.length > 0 && !hasEnoughCommitsForRateVerdict)
              ? `_Sample size (${commitMetrics.length} commit${commitMetrics.length === 1 ? '' : 's'}) is below the ${MIN_COMMITS_FOR_RATE_VERDICT}-commit convention for a rate verdict (code-quality-metrics-w9f): large-commit %, sprawling-commit % and test/prod co-change rate are reported below without a pass/fail judgement._`
              : '';

            // ---------------------------------------------------------------
            // Development pattern detection
            // ---------------------------------------------------------------

            const hasRefactoringPattern = commitMetrics.some(c =>
              /refactor|cleanup|reorganize|extract|rename/i.test(c.message)
            );

            // hasIncrementalPattern withdrawn (code-quality-metrics-4hu): every commit under a
            // hardcoded 200 production-line cutoff had no calibration basis at all, and no
            // repo-window statistic in lib/thresholds.js measures the same thing (a single
            // commit's raw line count, not a distribution percentile). avgCommitSize is already
            // reported below in the Commit Analysis table, so no information is lost by dropping
            // the pattern claim.

            // hasHighCochangeRate now gates on THRESHOLDS.TEST_COVERAGE_RATE.healthy instead of an
            // uncalibrated 50% cutoff (code-quality-metrics-4hu): cochangePct is the same
            // construct test_coverage_rate bands (same-commit test+prod co-occurrence rate, not
            // an ordering claim -- code-quality-metrics-36d), just measured over this PR's
            // commits instead of a repo-window sample. Also gated on
            // hasEnoughCommitsForRateVerdict (code-quality-metrics-w9f): below that sample size
            // the rate is not compared to the band at all.
            const hasHighCochangeRate = hasEnoughCommitsForRateVerdict &&
              cochangePct > THRESHOLDS.TEST_COVERAGE_RATE.healthy;

            // ---------------------------------------------------------------
            // Size classification
            // ---------------------------------------------------------------

            let sizeLabel = 'small';
            const concerns = [];
            const strengths = [];

            // The >500 and >200 tiers this used to carry (extra-large / large, each with its own
            // concern) are withdrawn (code-quality-metrics-4hu): neither had a calibration basis,
            // and 500 is the same magic number already withdrawn from code-metrics.yml's p90
            // bullet under code-quality-metrics-251. Only the >100 tier remains, referencing
            // CONFIG.LARGE_COMMIT_THRESHOLD instead of a separate hardcoded literal, since that
            // setting already has a home (it is the same detector setting large_commit applies
            // per-commit above). prodChanges is already reported above in the Production Code
            // breakdown, so no information is lost by dropping the finer-grained tiers.
            if (prodChanges > CONFIG.LARGE_COMMIT_THRESHOLD) {
              sizeLabel = 'large';
            }

            // prodFilesCount > 10 concern withdrawn (code-quality-metrics-4hu): no calibration
            // basis, and P90_FILES_CHANGED (healthy 8) measures a different statistic -- a p90
            // across many commits in a time window, not a single PR's raw file count -- so
            // forcing that band onto this literal would be the wrong-unit mistake this project
            // has already made once with squashed history. prodFilesCount is already reported
            // above in the Production Code breakdown.

            // largeCommits/sprawlingCommits concerns now gate on the calibrated critical bounds
            // the DORA table below already displays for the identical construct (percentage of
            // commits flagged large/sprawling within this PR's commit sample), rather than the
            // previously uncalibrated 50%/30% cutoffs (code-quality-metrics-4hu). The message
            // text also now interpolates CONFIG.LARGE_COMMIT_THRESHOLD/SPRAWLING_COMMIT_THRESHOLD
            // instead of restating 100/5 as separate literals (code-quality-metrics-vom). Both
            // are also gated on hasEnoughCommitsForRateVerdict (code-quality-metrics-w9f): at
            // n=1 a rate can only be 0% or 100%, so comparing it to a window-calibrated critical
            // bound is not a meaningful comparison below that sample size.
            if (hasEnoughCommitsForRateVerdict &&
                largeCommits > commitMetrics.length * (THRESHOLDS.LARGE_COMMITS_PCT.critical / 100)) {
              concerns.push(`${largeCommits}/${commitMetrics.length} commits exceed ${CONFIG.LARGE_COMMIT_THRESHOLD} production lines`);
            }

            if (hasEnoughCommitsForRateVerdict &&
                sprawlingCommits > commitMetrics.length * (THRESHOLDS.SPRAWLING_COMMITS_PCT.critical / 100)) {
              concerns.push(`${sprawlingCommits}/${commitMetrics.length} commits touch more than ${CONFIG.SPRAWLING_COMMIT_THRESHOLD} files`);
            }

            // Message quality verdict withdrawn (code-quality-metrics-4hu): this used to push a
            // concern against a hardcoded 40% cutoff while the DORA table two sections below
            // states "no band, see spec" for the same value -- a contradiction inside one PR
            // comment. MESSAGE_QUALITY_PCT carries no key in lib/thresholds.js (the metric was
            // found to measure Conventional Commits adoption rather than informativeness, and
            // 40 was never derived from anything). The value is still reported, without a
            // verdict, in the DORA table and the Commit Analysis table below.

            if (hasHighCochangeRate) {
              strengths.push('High test/prod co-change rate across commits');
            }

            if (hasRefactoringPattern) {
              strengths.push('Includes refactoring or cleanup work');
            }

            if (testOnlyCommits > 0) {
              strengths.push(`${testOnlyCommits} test-only commits`);
            }


            // ---------------------------------------------------------------
            // Test adequacy
            // ---------------------------------------------------------------

            let testAdequacy = 'excellent';
            const testConcerns = [];
            const testPraise = [];
            const testRatio = prodChanges > 0 ? (testChanges / prodChanges) : 0;

            if (prodChanges === 0) {
              if (testChanges > 0) {
                testAdequacy = 'excellent';
                testPraise.push('Test-only changes - refactoring or test improvements');
              } else {
                testAdequacy = 'n/a';
              }
            } else if (testChanges === 0) {
              testAdequacy = 'poor';
              testConcerns.push('No test changes for production code modifications');
              if (prodOnlyCommits === commitMetrics.length) {
                testConcerns.push('All commits lack test coverage');
              }
            } else {
              // No calibrated band exists for this ratio (code-quality-metrics-a1n):
              // it never appears in lib/thresholds.js or calibration/derive-bands.js, and
              // the two numeric ranges this used to display (0.3-2.0 gating the verdict,
              // 0.5-2.0 in the displayed target) disagreed with each other. Report the
              // ratio descriptively rather than attaching an uncalibrated verdict to it.
              testAdequacy = 'measured';
            }

            // ---------------------------------------------------------------
            // DORA archetype
            // ---------------------------------------------------------------

            // message_quality_pct is not passed here: classifyDoraArchetype (lib/metrics.js)
            // reads only large-commit, sprawling, test-coverage and uncovered-prod from
            // THRESHOLDS, so message quality has no part in the archetype (code-quality-metrics-4hu).
            const archetype = commitMetrics.length > 0
              ? classifyDoraArchetype({ large_commits_pct: largePct.toFixed(2), sprawling_commits_pct: sprawlingPct.toFixed(2), test_coverage_rate: testCoveragePct.toFixed(2), uncovered_prod_rate: uncoveredProdPct.toFixed(2) })
              : 'mixed-signals';

            const archetypeDescriptions = {
              'harmonious-high-achiever': 'Strong batch discipline, test coverage, and message quality. AI tools likely amplifying positive outcomes.',
              'foundational-challenges': 'Weak testing or batch discipline detected. Consider strengthening practices before scaling AI usage.',
              'legacy-bottleneck': 'High sprawl combined with large commits. AI may be making cross-cutting changes worse.',
              'mixed-signals': 'No clear archetype pattern. Review individual metric thresholds.'
            };

            // ---------------------------------------------------------------
            // PR comment
            // ---------------------------------------------------------------

            const breakdown = [
              `**Production Code:** ${prodChanges} lines (${prodFilesCount} files)`,
              `**Test Code:** ${testChanges} lines (${testFilesCount} files)`,
              `**Total:** ${totalChanges} lines (${totalChangedFiles} files)`,
              prodChanges > 0 ? `**Test-to-Production Ratio:** ${testRatio.toFixed(2)}:1` : ''
            ].filter(Boolean).join('\n');

            const commitRows = commitMetrics.slice(0, 10).map(c => {
              const flags = [
                c.large_commit ? 'large' : '',
                c.sprawling_commit ? 'sprawling' : '',
                c.test_prod_cochange_commit ? 'test+prod' : '',
                !c.message_quality ? 'vague-msg' : ''
              ].filter(Boolean).join(', ');
              return `**${c.sha}** ${c.author} (${c.date})\n\`${c.message}\`\n${c.prod_changes} prod lines, ${c.files_changed} files${flags ? ` [${flags}]` : ''}`;
            }).join('\n\n');

            const doraSection = commitMetrics.length > 0 ? [
              '### DORA Capability Assessment',
              '',
              `**Archetype:** ${archetype}`,
              archetypeDescriptions[archetype],
              '',
              '| Capability | Metric | Value | Target |',
              '|------------|--------|-------|--------|',
              `| Small Batches | Large commit % | ${largePct.toFixed(0)}% | ${formatBand('below', THRESHOLDS.LARGE_COMMITS_PCT.healthy, THRESHOLDS.LARGE_COMMITS_PCT.critical)} |`,
              `| Small Batches | Sprawling commit % | ${sprawlingPct.toFixed(0)}% | ${formatBand('below', THRESHOLDS.SPRAWLING_COMMITS_PCT.healthy, THRESHOLDS.SPRAWLING_COMMITS_PCT.critical)} |`,
              `| Version Control | Test/prod co-change rate | ${cochangePct.toFixed(0)}% | ${formatBand('above', THRESHOLDS.TEST_COVERAGE_RATE.healthy, null)} |`,
              `| Version Control | Message quality | ${msgQualityPct.toFixed(0)}% | no band, see spec |`,
              `| AI Risk Signal | Net additions ratio (median) | ${medianAdditionsRatio.toFixed(2)} | no band, see spec |`
            ].join('\n') : '';

            const layerIndicator = anthropicClient
              ? '_Layer 1 (static) and Layer 2 (semantic) ran._'
              : '_Layer 1 (static) ran. Set ANTHROPIC_API_KEY to enable semantic analysis._';

            const showDuplicationSection = staticDuplicates.length > 0 || semanticFindings.length > 0 || anthropicClient !== null;

            const staticBlock = staticDuplicates.length > 0 ? [
              `Found ${staticDuplicates.length} duplicate block(s) across the changed files:`,
              ...staticDuplicates.slice(0, 10).map(d =>
                `- \`${d.firstFile.name}:${d.firstFile.start}-${d.firstFile.end}\` duplicates \`${d.secondFile.name}:${d.secondFile.start}-${d.secondFile.end}\` (${d.lines} lines, ${d.tokens} tokens)`
              ),
              ...(staticDuplicates.length > 10 ? [`and ${staticDuplicates.length - 10} more...`] : [])
            ].join('\n') : 'No static duplicates found.';

            const semanticBlock = semanticFindings.length > 0 ? [
              '### Semantic Similarity',
              ...semanticFindings.map(f => `- \`${f.file1}\` / \`${f.file2}\`: ${f.similarity} (confidence: ${f.confidence})`)
            ].join('\n') : '';

            const duplicationSection = showDuplicationSection ? [
              '## Duplicate Code',
              '',
              staticBlock,
              '',
              semanticBlock,
              '',
              layerIndicator
            ].filter(s => s !== '').join('\n') : '';

            const commentParts = [
              '## PR Analysis',
              '',
              `**Size:** ${sizeLabel} (based on production code)`,
              '',
              breakdown,
              '',
              concerns.length > 0
                ? '### Concerns\n\n' + concerns.map(c => `- ${c}`).join('\n')
                : 'No size or quality concerns.',
              '',
              strengths.length > 0
                ? '### Strengths\n\n' + strengths.map(s => `- ${s}`).join('\n')
                : '',
              '',
              '## Commit Analysis',
              '',
              `**Total Commits:** ${commitMetrics.length}`,
              botCommitCount > 0 ? `**Bot commits excluded:** ${botCommitCount} (dependency/CI, not counted above)` : '',
              `**Average Commit Size:** ${avgCommitSize.toFixed(0)} production lines`,
              `**Average Files per Commit:** ${avgFilesPerCommit.toFixed(1)}`,
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| Large commits (>${CONFIG.LARGE_COMMIT_THRESHOLD} prod lines) | ${largeCommits}/${commitMetrics.length} (${largePct.toFixed(0)}%) |`,
              `| Sprawling commits (>${CONFIG.SPRAWLING_COMMIT_THRESHOLD} files) | ${sprawlingCommits}/${commitMetrics.length} (${sprawlingPct.toFixed(0)}%) |`,
              `| Test/prod co-change rate | ${cochangeCommits}/${commitMetrics.length} (${cochangePct.toFixed(0)}%) |`,
              `| Message quality | ${qualityCommits}/${commitMetrics.length} (${msgQualityPct.toFixed(0)}%) |`,
              `| Median net additions ratio | ${medianAdditionsRatio.toFixed(2)} |`,
              `| Test-only commits | ${testOnlyCommits} |`,
              `| Production-only commits | ${prodOnlyCommits} |`,
              '',
              commitMetrics.length <= 10 ? '### Commit Details\n\n' + commitRows : '',
              '',
              testAdequacy !== 'n/a' ? [
                '## Test Coverage',
                '',
                testAdequacy === 'measured'
                  ? `**Test-to-Production Ratio:** ${testRatio.toFixed(2)}:1 (no calibrated target for this ratio; reported descriptively)`
                  : `**Test Adequacy:** ${testAdequacy}`,
                '',
                testPraise.length > 0 ? testPraise.map(p => `- ${p}`).join('\n') : '',
                testConcerns.length > 0 ? testConcerns.map(c => `- ${c}`).join('\n') : ''
              ].join('\n') : '',
              '',
              doraSection,
              '',
              smallSampleNote,
              '',
              duplicationSection,
              '',
              '_Automated by Code Metrics Workflow_'
            ].filter(s => s !== '').join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentParts
            });
